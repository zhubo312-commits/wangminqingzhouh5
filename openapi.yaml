openapi: 3.1.0
info:
  title: 国学老师 H5 API
  version: 2.7.0
  description: 首页与专业排盘公开接口。出生或起盘信息和排盘引用仅通过 POST 请求体提交。
paths:
  /api/v1/home:
    get:
      summary: 获取北京时间当天首页内容
      responses:
        "200":
          description: 首页数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/events:
    post:
      summary: 记录匿名业务点击计数
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event:
                  type: string
                  enum: [home_view, paipan_click, interpretation_click, learning_click, question_click]
      responses:
        "204":
          description: 已记录
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/paipan/areas:
    get:
      summary: 获取排盘地区树
      responses:
        "200":
          description: 地区树，其他地区的编码为 999999
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaNode"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/paipan/bazi/resolve-birth:
    post:
      summary: 将阳历、阴历或四柱反查解析为阳历候选
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveBirthRequest"
      responses:
        "200":
          description: 候选阳历时间；四柱反查固定使用 sect=2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveBirthResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/paipan/bazi/chart:
    post:
      summary: 生成生平子时完整命盘
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartRequest"
      responses:
        "200":
          description: 分组后的完整排盘结果及短期排盘引用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartWithReference"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/paipan/bazi/context:
    post:
      summary: 使用短期排盘引用读取完整排盘上下文
      description: >-
        为页面刷新恢复、未来智能老师后端及 MCP 工具提供同一份强类型数据。
        paipan_ref 是短期读取凭证，不应记录到日志或拼接原始出生信息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paipan_ref]
              properties:
                paipan_ref:
                  $ref: "#/components/schemas/PaipanReference"
      responses:
        "200":
          description: 完整、带版本号的排盘上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaipanContext"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/paipan/bazi/flow-months:
    post:
      summary: 获取指定流年的十二流月
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chart, year]
              properties:
                chart:
                  $ref: "#/components/schemas/ChartRequest"
                year:
                  type: integer
                  minimum: 1900
                  maximum: 2200
      responses:
        "200":
          description: 十二流月及联动信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowMonthsResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/paipan/bazi/shen-sha:
    post:
      summary: 按盘面目标计算神煞
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pillars, target]
              properties:
                pillars:
                  type: object
                  additionalProperties:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: string
                      minLength: 1
                      maxLength: 1
                target:
                  $ref: "#/components/schemas/ShenShaTarget"
      responses:
        "200":
          description: 神煞名称
          content:
            application/json:
              schema:
                type: object
                required: [target, names]
                properties:
                  target:
                    $ref: "#/components/schemas/ShenShaTarget"
                  names:
                    type: array
                    items: { type: string }
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/paipan/dunjia/chart:
    post:
      summary: 生成转盘拆补遁甲盘
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DunjiaChartRequest"
      responses:
        "200":
          description: 九宫、节气、旬首、四害、长生及短期排盘引用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DunjiaChartWithReference"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/paipan/dunjia/context:
    post:
      summary: 使用短期排盘引用读取完整遁甲上下文
      description: >-
        为页面刷新恢复、未来智能老师后端及 MCP 工具提供同一份强类型数据。
        paipan_ref 是短期读取凭证，不应记录到日志或拼接原始起盘信息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paipan_ref]
              properties:
                paipan_ref:
                  $ref: "#/components/schemas/PaipanReference"
      responses:
        "200":
          description: 完整、带版本号的遁甲排盘上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DunjiaContext"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/paipan/juece/chart:
    post:
      summary: 生成时家决策盘
      description: 仅返回盘面结构，不提供个案吉凶判断。转盘为兼容参考站固定按拆补、时空、寄坤宫及原始钟表时间起局；飞盘按请求中的顺逆、定局、旬空和真太阳时条件起局。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JueceChartRequest"
      responses:
        "200":
          description: 标准化九宫盘及短期排盘引用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JueceChartWithReference"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/paipan/juece/context:
    post:
      summary: 使用短期排盘引用读取时家决策上下文
      description: paipan_ref 只用于当前标签页短期恢复，服务端数据库仅保存引用哈希。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paipan_ref]
              properties:
                paipan_ref:
                  $ref: "#/components/schemas/PaipanReference"
      responses:
        "200":
          description: 带盘型与版本号的完整时家决策上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JueceContext"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/paipan/yinpan-juece/chart:
    post:
      summary: 生成阴盘决策时盘或刻盘
      description: 保留参考站时盘、刻盘、事项、性别和可选终身局资料；结果只提供结构化盘面，不输出个案吉凶判断。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YinpanChartRequest"
      responses:
        "200":
          description: 阴盘九宫、四害、十二长生、天门地户及短期排盘引用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YinpanChartWithReference"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/paipan/yinpan-juece/context:
    post:
      summary: 使用短期排盘引用读取阴盘决策上下文
      description: paipan_ref 只用于当前标签页短期恢复，服务端数据库仅保存引用哈希。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paipan_ref]
              properties:
                paipan_ref:
                  $ref: "#/components/schemas/PaipanReference"
      responses:
        "200":
          description: 带盘型与版本号的完整阴盘决策上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YinpanContext"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/paipan/meihua/chart:
    post:
      summary: 生成梅花易数本卦、互卦与变卦
      description: 支持时间、随机、报数与指定四种起盘方式；随机起盘的上下卦及动爻由客户端生成后作为确定参数提交。六十四卦原文为前端静态参考资料，不进入排盘上下文。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeihuaChartRequest"
      responses:
        "200":
          description: 本卦、互卦、变卦、四柱信息及短期排盘引用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeihuaChartWithReference"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/paipan/meihua/context:
    post:
      summary: 使用短期排盘引用读取梅花上下文
      description: paipan_ref 只用于当前标签页短期恢复，服务端数据库仅保存引用哈希。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paipan_ref]
              properties:
                paipan_ref:
                  $ref: "#/components/schemas/PaipanReference"
      responses:
        "200":
          description: 带版本号的完整梅花排盘上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeihuaContext"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/paipan/luoji/chart:
    post:
      summary: 生成六爻逻辑盘
      description: 支持铜钱摇盘、盘名指定和六位硬币背数三种方式；返回本卦、变卦、八宫归属、世应、六神、伏神、六亲与纳甲，不输出个案吉凶判断。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LuojiChartRequest"
      responses:
        "200":
          description: 标准化六爻盘及短期排盘引用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LuojiChartWithReference"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/paipan/luoji/context:
    post:
      summary: 使用短期排盘引用读取六爻逻辑盘上下文
      description: paipan_ref 只用于当前标签页短期恢复，服务端数据库仅保存引用哈希。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paipan_ref]
              properties:
                paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
      responses:
        "200":
          description: 带版本号的完整六爻逻辑盘上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LuojiContext"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/paipan/shanxiang-juece/chart:
    post:
      summary: 生成山向决策三盘
      description: 按输入角度所在十五度分区生成三个五度山向奇门盘，并返回短期恢复引用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShanxiangChartRequest"
      responses:
        "200":
          description: 山向决策排盘结果与短期引用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShanxiangChartWithReference"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/v1/paipan/shanxiang-juece/context:
    post:
      summary: 读取短期山向决策排盘上下文
      description: paipan_ref 只用于当前标签页短期恢复，服务端数据库仅保存引用哈希。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paipan_ref]
              properties:
                paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
      responses:
        "200":
          description: 带版本号的完整山向决策排盘上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShanxiangContext"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/paipan/xingxiang/chart:
    post:
      summary: 生成飞星紫微盘
      description: 返回十二宫、星曜、生年四化、宫干自化、十二大限与每限十个流年，并签发短期排盘引用。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XingxiangChartRequest" }
      responses:
        "200":
          description: 标准化飞星紫微盘及短期排盘引用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XingxiangChartWithReference" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /api/v1/paipan/xingxiang/context:
    post:
      summary: 使用短期排盘引用读取星像上下文
      description: paipan_ref 只用于当前标签页短期恢复，服务端数据库仅保存引用哈希。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paipan_ref]
              properties:
                paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
      responses:
        "200":
          description: 带版本号的完整星像排盘上下文
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XingxiangContext" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/paipan/shuzi-guilv/chart:
    post:
      summary: 生成先后天数字规律盘
      description: 按生肖、农历月日与时辰取数，返回先后天数字、阴阳五行及原系统特殊数组解读。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShuziGuilvChartRequest" }
      responses:
        "200":
          description: 标准化数字规律盘及短期排盘引用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShuziGuilvChartWithReference" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /api/v1/paipan/shuzi-guilv/context:
    post:
      summary: 使用短期排盘引用读取数字规律上下文
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paipan_ref]
              properties:
                paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
      responses:
        "200":
          description: 带版本号的完整数字规律排盘上下文
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShuziGuilvContext" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/paipan/xuankong-feixing/chart:
    post:
      summary: 生成玄空飞星九宫盘
      description: 按元运、二十四山、下盘或替盘规则布运星、山星、向星及年月日时飞星。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XuankongFeixingChartRequest" }
      responses:
        "200":
          description: 标准化玄空飞星盘及短期排盘引用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XuankongFeixingChartWithReference" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /api/v1/paipan/xuankong-feixing/context:
    post:
      summary: 使用短期排盘引用读取玄空飞星上下文
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paipan_ref]
              properties:
                paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
      responses:
        "200":
          description: 带版本号的完整玄空飞星排盘上下文
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XuankongFeixingContext" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/paipan/xingming/chart:
    post:
      summary: 生成姓名学三才五格或六格盘
      description: 姓名按正式字典逐字规范化为康熙繁体，并使用严格康熙笔画计算；字库未收录的输入返回 422，正式数理资源缺项返回 500。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XingmingChartRequest" }
      responses:
        "200":
          description: 含数据集状态的姓名学结果及短期排盘引用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XingmingChartWithReference" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /api/v1/paipan/xingming/context:
    post:
      summary: 使用短期排盘引用读取姓名学上下文
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paipan_ref]
              properties:
                paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
      responses:
        "200":
          description: 带版本号的完整姓名学上下文
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XingmingContext" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /health:
    get:
      summary: Fastify 存活检查
      responses:
        "200": { description: 服务存活 }
  /ready:
    get:
      summary: SQLite、日历与排盘算法服务就绪检查
      responses:
        "200": { description: 服务就绪 }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  responses:
    ValidationError:
      description: 字段校验或业务输入错误
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: 排盘算法服务不可用或返回异常
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GatewayTimeout:
      description: 排盘算法服务超时
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: 服务尚未就绪
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 排盘引用不存在
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: 排盘引用已过期
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    BirthDateTime:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$'
      example: "1998-12-18 12:00"
    StringList:
      type: array
      items: { type: string }
    ShenShaTarget:
      type: string
      enum: [nian, yue, ri, shi, dayun, liunian, liuyue]
    AreaNode:
      type: object
      required: [label, code, children]
      properties:
        label: { type: string }
        code: { type: string }
        children:
          type: array
          items:
            $ref: "#/components/schemas/AreaNode"
    ResolveBirthRequest:
      oneOf:
        - type: object
          required: [mode, solarDateTime]
          properties:
            mode: { const: solar }
            solarDateTime:
              $ref: "#/components/schemas/BirthDateTime"
        - type: object
          required: [mode, lunar]
          properties:
            mode: { const: lunar }
            lunar:
              type: object
              required: [year, month, day, hour, minute, leapMonth]
              properties:
                year: { type: integer, minimum: 1900, maximum: 2100 }
                month: { type: integer, minimum: 1, maximum: 12 }
                day: { type: integer, minimum: 1, maximum: 30 }
                hour: { type: integer, minimum: 0, maximum: 23 }
                minute: { type: integer, minimum: 0, maximum: 59 }
                leapMonth: { type: boolean }
        - type: object
          required: [mode, pillars]
          properties:
            mode: { const: fourPillars }
            pillars:
              type: object
              required: [year, month, day, hour]
              properties:
                year: { type: string, minLength: 2, maxLength: 2 }
                month: { type: string, minLength: 2, maxLength: 2 }
                day: { type: string, minLength: 2, maxLength: 2 }
                hour: { type: string, minLength: 2, maxLength: 2 }
      discriminator:
        propertyName: mode
    ResolveBirthResponse:
      type: object
      required: [candidates, sect]
      properties:
        candidates:
          type: array
          items:
            type: object
            required: [id, solarDateTime, label]
            properties:
              id: { type: string }
              solarDateTime:
                $ref: "#/components/schemas/BirthDateTime"
              label: { type: string }
        sect: { const: 2 }
    ChartRequest:
      type: object
      required: [name, gender, birthDateTime, areaCode, useTrueSolarTime]
      properties:
        name: { type: string, maxLength: 32, description: 可为空字符串 }
        gender: { type: string, enum: [male, female] }
        birthDateTime:
          $ref: "#/components/schemas/BirthDateTime"
        areaCode: { type: string, pattern: '^\d{6}$' }
        useTrueSolarTime: { type: boolean }
    Profile:
      type: object
      required: [name, gender, birthDateTime, lunarDate, area, areaCode, chineseZodiac, zodiac]
      properties:
        name: { type: string }
        gender: { type: string, enum: [male, female] }
        birthDateTime:
          $ref: "#/components/schemas/BirthDateTime"
        lunarDate: { type: string }
        area: { type: string }
        areaCode: { type: string }
        trueSolarTime: { type: [string, "null"] }
        chineseZodiac: { type: string }
        zodiac: { type: string }
    BasicFacts:
      type: object
      required: [benMingFo, taiYuan, taiYuanNaYin, mingGong, mingGongNaYin, duiChong, sanSha, wenChangWei, prevSolarTerm, nextSolarTerm]
      properties:
        benMingFo: { type: string }
        taiYuan: { type: string }
        taiYuanNaYin: { type: string }
        mingGong: { type: string }
        mingGongNaYin: { type: string }
        duiChong: { type: string }
        sanSha: { type: string }
        wenChangWei: { type: string }
        prevSolarTerm: { type: string }
        nextSolarTerm: { type: string }
    HiddenStem:
      type: object
      required: [stem, element, tenGod]
      properties:
        stem: { type: string }
        element: { type: string }
        tenGod: { type: string }
    Pillar:
      type: object
      required: [key, label, stem, branch, stemElement, branchElement, tenGod, hiddenStems, growth, selfSeat, naYin, voidBranch, shenSha]
      properties:
        key: { type: string, enum: [year, month, day, hour] }
        label: { type: string }
        stem: { type: string }
        branch: { type: string }
        stemElement: { type: string }
        branchElement: { type: string }
        tenGod: { type: string }
        hiddenStems:
          type: array
          items:
            $ref: "#/components/schemas/HiddenStem"
        growth: { type: string }
        selfSeat: { type: string }
        naYin: { type: string }
        voidBranch: { type: string }
        shenSha:
          $ref: "#/components/schemas/StringList"
    Attention:
      type: object
      required: [heavenlyStems, earthlyBranches]
      properties:
        heavenlyStems:
          $ref: "#/components/schemas/StringList"
        earthlyBranches:
          $ref: "#/components/schemas/StringList"
    FlowYear:
      type: object
      required: [index, year, age, ganZhi, voidBranch, tenGods, hiddenStems, hiddenStemTenGods, wealthStrong, heavenlyStemAttention, earthlyBranchAttention, shenSha]
      properties:
        index: { type: integer }
        year: { type: integer }
        age: { type: integer }
        ganZhi: { type: string }
        voidBranch: { type: string }
        tenGods: { $ref: "#/components/schemas/StringList" }
        hiddenStems: { type: string }
        hiddenStemTenGods: { $ref: "#/components/schemas/StringList" }
        wealthStrong: { type: boolean }
        heavenlyStemAttention: { $ref: "#/components/schemas/StringList" }
        earthlyBranchAttention: { $ref: "#/components/schemas/StringList" }
        shenSha: { $ref: "#/components/schemas/StringList" }
    FortunePeriod:
      type: object
      required: [index, startYear, endYear, startAge, endAge, ganZhi, tenGods, growth, hiddenStems, hiddenStemTenGods, wealthStrong, heavenlyStemAttention, earthlyBranchAttention, shenSha, years]
      properties:
        index: { type: integer }
        startYear: { type: integer }
        endYear: { type: integer }
        startAge: { type: integer }
        endAge: { type: integer }
        ganZhi: { type: string }
        tenGods: { $ref: "#/components/schemas/StringList" }
        growth: { type: string }
        hiddenStems: { type: string }
        hiddenStemTenGods: { $ref: "#/components/schemas/StringList" }
        wealthStrong: { type: boolean }
        heavenlyStemAttention: { $ref: "#/components/schemas/StringList" }
        earthlyBranchAttention: { $ref: "#/components/schemas/StringList" }
        shenSha: { $ref: "#/components/schemas/StringList" }
        years:
          type: array
          items: { $ref: "#/components/schemas/FlowYear" }
    StrengthReference:
      type: object
      required: [legacyScore, samePartyScore, otherPartyScore, level, pattern, summary, favorableGod, favorableElements, relationScores]
      properties:
        legacyScore: { type: integer }
        samePartyScore: { type: integer }
        otherPartyScore: { type: integer }
        level: { type: string }
        pattern: { type: string }
        summary: { type: string }
        favorableGod: { type: string }
        favorableElements: { $ref: "#/components/schemas/StringList" }
        relationScores:
          type: object
          additionalProperties: { type: integer }
    ChartResponse:
      type: object
      required: [profile, basicFacts, pillars, attention, shenShaDescriptions, fortune, strength]
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        basicFacts: { $ref: "#/components/schemas/BasicFacts" }
        pillars:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: "#/components/schemas/Pillar" }
        attention: { $ref: "#/components/schemas/Attention" }
        shenShaDescriptions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StringList"
        fortune:
          type: object
          required: [startSolar, startDescription, changeDescription, periods]
          properties:
            startSolar: { type: string }
            startDescription: { type: string }
            changeDescription: { type: string }
            periods:
              type: array
              items: { $ref: "#/components/schemas/FortunePeriod" }
        strength: { $ref: "#/components/schemas/StrengthReference" }
    PaipanReference:
      type: string
      pattern: '^pp_[A-Za-z0-9_-]{32}$'
      example: pp_0123456789abcdefghijklmnopqrstuv
      description: 具有读取能力的短期随机引用；只通过 POST 请求体或受控 Dify/MCP 输入传递
    ChartWithReference:
      allOf:
        - $ref: "#/components/schemas/ChartResponse"
        - type: object
          required: [paipan_ref, expiresAt]
          properties:
            paipan_ref:
              $ref: "#/components/schemas/PaipanReference"
            expiresAt:
              type: string
              format: date-time
    PaipanContext:
      type: object
      required: [schemaVersion, chartType, paipan_ref, generatedAt, expiresAt, chartRequest, chart]
      properties:
        schemaVersion:
          const: guoxue.paipan.bazi.v1
        chartType:
          const: shengping_zishi
        paipan_ref:
          $ref: "#/components/schemas/PaipanReference"
        generatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        chartRequest:
          $ref: "#/components/schemas/ChartRequest"
        chart:
          $ref: "#/components/schemas/ChartResponse"
    DunjiaChartRequest:
      type: object
      required: [chartDateTime]
      properties:
        chartDateTime:
          $ref: "#/components/schemas/BirthDateTime"
    DunjiaGrowthStage:
      type: object
      required: [branch, stage]
      properties:
        branch: { type: string }
        stage: { type: string }
    DunjiaHarm:
      type: object
      required: [symbol, type]
      properties:
        symbol: { type: string }
        type: { type: string, enum: [迫, 墓, 刑] }
    DunjiaPalace:
      type: object
      required: [index, trigram, direction, element, deity, star, door, heavenPlate, earthPlate, hiddenStem, isVoid, isChief, isChiefDoor, isHorse, harms, heavenGrowth, earthGrowth]
      properties:
        index: { type: integer, minimum: 1, maximum: 9 }
        trigram: { type: string }
        direction: { type: string }
        element: { type: string }
        deity: { type: [string, "null"] }
        star: { type: [string, "null"] }
        door: { type: [string, "null"] }
        heavenPlate: { type: string }
        earthPlate: { type: string }
        hiddenStem: { type: [string, "null"] }
        isVoid: { type: boolean }
        isChief: { type: boolean }
        isChiefDoor: { type: boolean }
        isHorse: { type: boolean }
        harms:
          type: array
          items: { $ref: "#/components/schemas/DunjiaHarm" }
        heavenGrowth:
          type: array
          items: { $ref: "#/components/schemas/DunjiaGrowthStage" }
        earthGrowth:
          type: array
          items: { $ref: "#/components/schemas/DunjiaGrowthStage" }
    DunjiaChartResponse:
      type: object
      required: [overview, palaces, heavenEarthGates]
      properties:
        overview:
          type: object
          required: [method, solarDateTime, lunarDate, pillars, voidBranches, previousSolarTerm, nextSolarTerm, dunType, juNumber, xunShou, chiefStar, chiefDoor, horse]
          properties:
            method: { const: 转盘-拆补-寄坤二宫 }
            solarDateTime: { $ref: "#/components/schemas/BirthDateTime" }
            lunarDate: { type: string }
            pillars:
              type: object
              required: [year, month, day, hour]
              properties:
                year: { type: string, minLength: 2, maxLength: 2 }
                month: { type: string, minLength: 2, maxLength: 2 }
                day: { type: string, minLength: 2, maxLength: 2 }
                hour: { type: string, minLength: 2, maxLength: 2 }
            voidBranches:
              type: object
              required: [year, month, day, hour]
              properties:
                year: { type: string }
                month: { type: string }
                day: { type: string }
                hour: { type: string }
            previousSolarTerm:
              $ref: "#/components/schemas/DunjiaSolarTerm"
            nextSolarTerm:
              $ref: "#/components/schemas/DunjiaSolarTerm"
            dunType: { type: string, enum: [阴, 阳] }
            juNumber: { type: integer, minimum: 1, maximum: 9 }
            xunShou: { type: string }
            chiefStar:
              $ref: "#/components/schemas/DunjiaChiefPosition"
            chiefDoor:
              $ref: "#/components/schemas/DunjiaChiefPosition"
            horse:
              type: object
              required: [trigram, branch]
              properties:
                trigram: { type: string }
                branch: { type: string }
        palaces:
          type: array
          minItems: 9
          maxItems: 9
          items: { $ref: "#/components/schemas/DunjiaPalace" }
        heavenEarthGates:
          type: array
          minItems: 12
          maxItems: 12
          items:
            type: object
            required: [branch, heavenGate, earthGate]
            properties:
              branch: { type: string }
              heavenGate: { type: string }
              earthGate: { type: string }
    DunjiaSolarTerm:
      type: object
      required: [name, dateTime]
      properties:
        name: { type: string }
        dateTime: { type: string }
    DunjiaChiefPosition:
      type: object
      required: [name, palace]
      properties:
        name: { type: string }
        palace: { type: integer, minimum: 1, maximum: 9 }
    DunjiaChartWithReference:
      allOf:
        - $ref: "#/components/schemas/DunjiaChartResponse"
        - type: object
          required: [paipan_ref, expiresAt]
          properties:
            paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
            expiresAt: { type: string, format: date-time }
    DunjiaContext:
      type: object
      required: [schemaVersion, chartType, paipan_ref, generatedAt, expiresAt, chartRequest, chart]
      properties:
        schemaVersion: { const: guoxue.paipan.dunjia.v1 }
        chartType: { const: dunjia }
        paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
        generatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        chartRequest: { $ref: "#/components/schemas/DunjiaChartRequest" }
        chart: { $ref: "#/components/schemas/DunjiaChartResponse" }
    JueceChartRequest:
      type: object
      description: 转盘请求中的历史定局、旬空与寄宫值仅用于旧上下文兼容，结果按参考站固定口径返回；飞盘字段按值生效。
      additionalProperties: false
      required: [chartDateTime, time, pan, bureau, voidBasis]
      properties:
        chartDateTime: { $ref: "#/components/schemas/BirthDateTime" }
        time:
          oneOf:
            - type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { const: standard }
            - type: object
              additionalProperties: false
              required: [mode, areaCode]
              properties:
                mode: { const: true_solar }
                areaCode: { type: string, pattern: "^[0-9]{6}$" }
        pan:
          oneOf:
            - type: object
              additionalProperties: false
              required: [style, centerPalaceMethod]
              properties:
                style: { const: rotating }
                centerPalaceMethod: { type: string, enum: [kun, yang_gen_yin_kun, four_corners, seasonal] }
            - type: object
              additionalProperties: false
              required: [style, directionRule]
              properties:
                style: { const: flying }
                directionRule: { type: string, enum: [yang_forward_yin_reverse, all_forward] }
        bureau:
          oneOf:
            - type: object
              additionalProperties: false
              required: [method]
              properties:
                method: { const: chai_bu }
            - type: object
              additionalProperties: false
              required: [method]
              properties:
                method: { const: zhi_run }
            - type: object
              additionalProperties: false
              required: [method]
              properties:
                method: { const: mao_shan }
            - type: object
              additionalProperties: false
              required: [method, dunType, number]
              properties:
                method: { const: manual }
                dunType: { type: string, enum: [yin, yang] }
                number: { type: integer, minimum: 1, maximum: 9 }
        voidBasis: { type: string, enum: [hour, day, month, year] }
    JuecePlateLayer:
      type: object
      required: [stem, star, door, deity]
      properties:
        stem: { type: [string, "null"] }
        star: { type: [string, "null"] }
        door: { type: [string, "null"] }
        deity: { type: [string, "null"] }
    JuecePalace:
      type: object
      required: [index, trigram, direction, element, heavenPlate, earthPlate, attached, hiddenGanZhi, isVoid, isHorse, isChief, isChiefDoor]
      properties:
        index: { type: integer, minimum: 1, maximum: 9 }
        trigram: { type: string }
        direction: { type: string }
        element: { type: string }
        heavenPlate: { $ref: "#/components/schemas/JuecePlateLayer" }
        earthPlate: { $ref: "#/components/schemas/JuecePlateLayer" }
        attached:
          oneOf:
            - type: "null"
            - type: object
              required: [earthStem, earthStar, heavenStem, heavenStar]
              properties:
                earthStem: { type: string }
                earthStar: { type: string }
                heavenStem: { type: [string, "null"] }
                heavenStar: { type: [string, "null"] }
        hiddenGanZhi: { type: [string, "null"] }
        isVoid: { type: boolean }
        isHorse: { type: boolean }
        isChief: { type: boolean }
        isChiefDoor: { type: boolean }
    JueceChartResponse:
      type: object
      required: [overview, palaces]
      properties:
        overview:
          type: object
          required: [method, clockDateTime, effectiveDateTime, timeMode, areaCode, areaName, trueSolarTime, lunarDate, pillars, voidBranches, selectedVoidBranches, previousSolarTerm, nextSolarTerm, panStyle, panStyleLabel, bureauMethod, bureauLabel, directionRule, centerPalaceMethod, dunType, juNumber, xunShou, chiefStar, chiefDoor, horse]
          properties:
            method: { type: string }
            clockDateTime: { $ref: "#/components/schemas/BirthDateTime" }
            effectiveDateTime: { $ref: "#/components/schemas/BirthDateTime" }
            timeMode: { type: string, enum: [standard, true_solar] }
            areaCode: { type: [string, "null"] }
            areaName: { type: [string, "null"] }
            trueSolarTime: { type: [string, "null"] }
            lunarDate: { type: string }
            pillars: { $ref: "#/components/schemas/JuecePillars" }
            voidBranches: { $ref: "#/components/schemas/JuecePillars" }
            selectedVoidBranches: { type: string, minLength: 2, maxLength: 2 }
            previousSolarTerm: { $ref: "#/components/schemas/JueceSolarTerm" }
            nextSolarTerm: { $ref: "#/components/schemas/JueceSolarTerm" }
            panStyle: { type: string, enum: [rotating, flying] }
            panStyleLabel: { type: string }
            bureauMethod: { type: string, enum: [chai_bu, zhi_run, mao_shan, manual] }
            bureauLabel: { type: string }
            directionRule: { type: [string, "null"] }
            centerPalaceMethod: { type: [string, "null"] }
            dunType: { type: string, enum: [阴, 阳] }
            juNumber: { type: integer, minimum: 1, maximum: 9 }
            xunShou: { type: string }
            chiefStar: { $ref: "#/components/schemas/JueceChief" }
            chiefDoor: { $ref: "#/components/schemas/JueceChief" }
            horse:
              type: object
              required: [branch, palace]
              properties:
                branch: { type: string, minLength: 1, maxLength: 1 }
                palace: { type: integer, minimum: 1, maximum: 9 }
        palaces:
          type: array
          minItems: 9
          maxItems: 9
          items: { $ref: "#/components/schemas/JuecePalace" }
    JuecePillars:
      type: object
      required: [year, month, day, hour]
      properties:
        year: { type: string, minLength: 2, maxLength: 2 }
        month: { type: string, minLength: 2, maxLength: 2 }
        day: { type: string, minLength: 2, maxLength: 2 }
        hour: { type: string, minLength: 2, maxLength: 2 }
    JueceSolarTerm:
      type: object
      required: [name, dateTime]
      properties:
        name: { type: string }
        dateTime: { type: string }
    JueceChief:
      type: object
      required: [name, palace]
      properties:
        name: { type: string }
        palace: { type: integer, minimum: 1, maximum: 9 }
    JueceChartWithReference:
      allOf:
        - $ref: "#/components/schemas/JueceChartResponse"
        - type: object
          required: [paipan_ref, expiresAt]
          properties:
            paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
            expiresAt: { type: string, format: date-time }
    JueceContext:
      type: object
      required: [schemaVersion, chartType, paipan_ref, generatedAt, expiresAt, chartRequest, chart]
      properties:
        schemaVersion: { const: guoxue.paipan.shijia_juece.v1 }
        chartType: { const: shijia_juece }
        paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
        generatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        chartRequest: { $ref: "#/components/schemas/JueceChartRequest" }
        chart: { $ref: "#/components/schemas/JueceChartResponse" }
    YinpanChartRequest:
      type: object
      additionalProperties: false
      required: [chartDateTime, gender, question, mode, lifetime]
      properties:
        chartDateTime: { $ref: "#/components/schemas/BirthDateTime" }
        gender: { type: string, enum: [male, female] }
        question: { type: string, maxLength: 30 }
        mode: { type: string, enum: [time, ke] }
        lifetime: { type: boolean }
    YinpanGrowthStage:
      type: object
      required: [branch, stage]
      properties:
        branch: { type: string, minLength: 1 }
        stage: { type: string, minLength: 1 }
    YinpanHarm:
      type: object
      required: [symbol, type]
      properties:
        symbol: { type: string, minLength: 1 }
        type: { type: string, enum: [迫, 墓, 刑] }
    YinpanPalace:
      type: object
      required: [index, trigram, direction, element, deity, star, door, heavenStems, earthStems, hiddenStem, harms, heavenGrowth, earthGrowth, isVoid, isHorse, isChief, isChiefDoor]
      properties:
        index: { type: integer, minimum: 1, maximum: 9 }
        trigram: { type: string }
        direction: { type: string }
        element: { type: string }
        deity: { type: [string, "null"] }
        star: { type: [string, "null"] }
        door: { type: [string, "null"] }
        heavenStems:
          type: array
          maxItems: 2
          items: { type: string, minLength: 1, maxLength: 1 }
        earthStems:
          type: array
