          type: array
          minItems: 9
          maxItems: 9
          items: { $ref: "#/components/schemas/JuecePalace" }
    JuecePillars:
      type: object
      required: [year, month, day, hour]
      properties:
        year: { type: string, minLength: 2, maxLength: 2 }
        month: { type: string, minLength: 2, maxLength: 2 }
        day: { type: string, minLength: 2, maxLength: 2 }
        hour: { type: string, minLength: 2, maxLength: 2 }
    JueceSolarTerm:
      type: object
      required: [name, dateTime]
      properties:
        name: { type: string }
        dateTime: { type: string }
    JueceChief:
      type: object
      required: [name, palace]
      properties:
        name: { type: string }
        palace: { type: integer, minimum: 1, maximum: 9 }
    JueceChartWithReference:
      allOf:
        - $ref: "#/components/schemas/JueceChartResponse"
        - type: object
          required: [paipan_ref, expiresAt]
          properties:
            paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
