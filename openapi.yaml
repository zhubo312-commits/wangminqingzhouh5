      properties:
        stem: { type: [string, "null"] }
        star: { type: [string, "null"] }
        door: { type: [string, "null"] }
        deity: { type: [string, "null"] }
    JuecePalace:
      type: object
      required: [index, trigram, direction, element, heavenPlate, earthPlate, attached, hiddenGanZhi, isVoid, isHorse, isChief, isChiefDoor]
      properties:
        index: { type: integer, minimum: 1, maximum: 9 }
        trigram: { type: string }
        direction: { type: string }
        element: { type: string }
        heavenPlate: { $ref: "#/components/schemas/JuecePlateLayer" }
        earthPlate: { $ref: "#/components/schemas/JuecePlateLayer" }
        attached:
          oneOf:
            - type: "null"
            - type: object
              required: [earthStem, earthStar, heavenStem, heavenStar]
              properties:
                earthStem: { type: string }
                earthStar: { type: string }
                heavenStem: { type: [string, "null"] }
                heavenStar: { type: [string, "null"] }
        hiddenGanZhi: { type: [string, "null"] }
        isVoid: { type: boolean }
        isHorse: { type: boolean }
        isChief: { type: boolean }
        isChiefDoor: { type: boolean }
    JueceChartResponse:
      type: object
      required: [overview, palaces]
      properties:
        overview:
          type: object
          required: [method, clockDateTime, effectiveDateTime, timeMode, areaCode, areaName, trueSolarTime, lunarDate, pillars, voidBranches, selectedVoidBranches, previousSolarTerm, nextSolarTerm, panStyle, panStyleLabel, bureauMethod, bureauLabel, directionRule, centerPalaceMethod, dunType, juNumber, xunShou, chiefStar, chiefDoor, horse]
          properties:
            method: { type: string }
            clockDateTime: { $ref: "#/components/schemas/BirthDateTime" }
            effectiveDateTime: { $ref: "#/components/schemas/BirthDateTime" }
            timeMode: { type: string, enum: [standard, true_solar] }
            areaCode: { type: [string, "null"] }
            areaName: { type: [string, "null"] }
            trueSolarTime: { type: [string, "null"] }
            lunarDate: { type: string }
            pillars: { $ref: "#/components/schemas/JuecePillars" }
            voidBranches: { $ref: "#/components/schemas/JuecePillars" }
            selectedVoidBranches: { type: string, minLength: 2, maxLength: 2 }
            previousSolarTerm: { $ref: "#/components/schemas/JueceSolarTerm" }
            nextSolarTerm: { $ref: "#/components/schemas/JueceSolarTerm" }
            panStyle: { type: string, enum: [rotating, flying] }
            panStyleLabel: { type: string }
            bureauMethod: { type: string, enum: [chai_bu, zhi_run, mao_shan, manual] }
            bureauLabel: { type: string }
            directionRule: { type: [string, "null"] }
            centerPalaceMethod: { type: [string, "null"] }
            dunType: { type: string, enum: [阴, 阳] }
            juNumber: { type: integer, minimum: 1, maximum: 9 }
            xunShou: { type: string }
            chiefStar: { $ref: "#/components/schemas/JueceChief" }
            chiefDoor: { $ref: "#/components/schemas/JueceChief" }
            horse:
              type: object
              required: [branch, palace]
              properties:
