              properties:
                mode: { const: standard }
            - type: object
              additionalProperties: false
              required: [mode, areaCode]
              properties:
                mode: { const: true_solar }
                areaCode: { type: string, pattern: "^[0-9]{6}$" }
        pan:
          oneOf:
            - type: object
              additionalProperties: false
              required: [style, centerPalaceMethod]
              properties:
                style: { const: rotating }
                centerPalaceMethod: { type: string, enum: [kun, yang_gen_yin_kun, four_corners, seasonal] }
            - type: object
              additionalProperties: false
              required: [style, directionRule]
              properties:
                style: { const: flying }
                directionRule: { type: string, enum: [yang_forward_yin_reverse, all_forward] }
        bureau:
          oneOf:
            - type: object
              additionalProperties: false
              required: [method]
              properties:
                method: { const: chai_bu }
            - type: object
              additionalProperties: false
              required: [method]
              properties:
                method: { const: zhi_run }
            - type: object
              additionalProperties: false
              required: [method]
              properties:
                method: { const: mao_shan }
            - type: object
              additionalProperties: false
              required: [method, dunType, number]
              properties:
                method: { const: manual }
                dunType: { type: string, enum: [yin, yang] }
                number: { type: integer, minimum: 1, maximum: 9 }
        voidBasis: { type: string, enum: [hour, day, month, year] }
    JuecePlateLayer:
      type: object
