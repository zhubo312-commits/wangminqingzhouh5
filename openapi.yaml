        schemaVersion: { const: guoxue.paipan.shijia_juece.v1 }
        chartType: { const: shijia_juece }
        paipan_ref: { $ref: "#/components/schemas/PaipanReference" }
        generatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
